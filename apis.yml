aid: specific
name: Specific
description: >-
  Specific is an infrastructure-as-code platform built for coding agents, positioned as "AWS for
  coding agents." Any coding agent (Claude Code, Cursor, Codex) defines its whole system in a single
  specific.hcl file — services, managed Postgres, S3-compatible object storage, Redis, real-time
  Postgres sync (powered by Electric), Temporal workflows, crons, secrets, volumes, custom domains,
  preview environments and environments — then runs it locally with `specific dev` and ships it to
  production with `specific deploy`. Everything is reached through the Specific CLI and a hosted docs
  MCP server rather than proprietary SDKs, so agents can build backends from natural-language prompts
  and deploy production infrastructure in minutes.
